databases:
  - name: team-task-db
    databaseName: taskmanager
    user: taskuser

services:
  - type: web
    name: team-task-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: team-task-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # Note: Update this to your frontend URL in the Render dashboard after deployment for security

  - type: web
    name: team-task-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: team-task-api
          envVarKey: RENDER_EXTERNAL_URL
